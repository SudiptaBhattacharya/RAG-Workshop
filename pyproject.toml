[project]
name = "ai-architecture-workshop"
version = "0.1.0"
description = "A first-principles workshop for APIs, RAG, embeddings, retrieval, and MCP"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "groq>=0.31",
  "mcp[cli]>=2,<3",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "pdfplumber>=0.11,<1",
  "plotly>=6,<7",
  "python-dotenv>=1,<2",
  "requests>=2.32,<3",
  "scikit-learn>=1.6,<2",
  "sentence-transformers>=5,<6",
  "streamlit>=1.40,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag_workshop", "student_lab"]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
